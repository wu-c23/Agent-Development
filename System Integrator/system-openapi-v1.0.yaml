openapi: "3.0.3"
info:
  title: 网络小说智能推荐系统 API
  description: |
    集趋势洞察、语义搜索、舆情分析为一体的网络小说智能推荐系统全局 API。
    本规范定义 System Integrator 对外暴露的统一接口及各子模块的内部接口契约。
  version: "1.0.0"
  contact:
    name: System Integrator - 苗文昊

servers:
  - url: http://localhost:8000/api/v1
    description: 集成网关 (开发环境)
  - url: http://localhost:8001/api/v1
    description: Trend Explorer Mock (吴隐)
  - url: http://localhost:8002/api/v1
    description: Safe-Search Architect Mock (吴宸)
  - url: http://localhost:8003/api/v1
    description: Sentiment Critic Mock (武文杰)

tags:
  - name: Gateway
    description: 集成网关 — 统一入口
  - name: Trend
    description: 全网风向标 — 吴隐
  - name: Search
    description: 精准找书 — 吴宸
  - name: Sentiment
    description: 书评挖掘 — 武文杰

paths:
  # ================================================================
  # Gateway: 统一对话入口
  # ================================================================
  /chat:
    post:
      tags: [Gateway]
      summary: AI 书友对话接口
      description: 接收自然语言输入，Router Agent 自动识别意图并分发到对应模块
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  description: 用户自然语言输入
                  example: "推荐几本类似《诡秘之主》但基调轻快的书，不要烂尾"
                session_id:
                  type: string
                  description: 会话 ID (可选，不传则自动创建)
      responses:
        "200":
          description: 聚合后的 AI 回复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "504":
          description: 全链路超时，返回降级推荐
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FallbackResponse"

  # ================================================================
  # Trend Explorer 接口
  # ================================================================
  /trend/hot:
    get:
      tags: [Trend]
      summary: 热门趋势榜单
      operationId: getTrendHot
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
        - name: platform
          in: query
          schema:
            type: string
            enum: [qidian, zongheng, all]
            default: all
      responses:
        "200":
          description: 热门趋势列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendData"

  /trend/detail/{uid}:
    get:
      tags: [Trend]
      summary: 单书趋势详情
      operationId: getTrendDetail
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{64}$"
      responses:
        "200":
          description: 趋势详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendData"
        "404":
          description: UID 未找到

  /trend/tags/evolution:
    get:
      tags: [Trend]
      summary: 标签演变数据
      operationId: getTagEvolution
      parameters:
        - name: tag
          in: query
          required: true
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: integer
            default: 30
            description: 统计天数
      responses:
        "200":
          description: 标签演变时间序列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagEvolution"

  # ================================================================
  # Safe-Search Architect 接口
  # ================================================================
  /search/semantic:
    post:
      tags: [Search]
      summary: 语义搜索
      operationId: semanticSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"

  /search/vector/health:
    get:
      tags: [Search]
      summary: 向量库健康检查
      operationId: vectorHealthCheck
      responses:
        "200":
          description: 健康状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, down]
                  index_count:
                    type: integer
                  last_updated:
                    type: string
                    format: date-time

  # ================================================================
  # Sentiment Critic 接口
  # ================================================================
  /sentiment/detail/{uid}:
    get:
      tags: [Sentiment]
      summary: 单书舆情详情
      operationId: getSentimentDetail
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{64}$"
      responses:
        "200":
          description: 舆情详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentimentData"
        "404":
          description: UID 未找到

  /sentiment/compare:
    get:
      tags: [Sentiment]
      summary: 多书舆情对比
      operationId: compareSentiment
      parameters:
        - name: uids
          in: query
          required: true
          schema:
            type: string
            description: 逗号分隔的 UID 列表
          example: "abc123...,def456...,ghi789..."
      responses:
        "200":
          description: 对比结果
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SentimentData"

  # ================================================================
  # 运维接口
  # ================================================================
  /ops/health:
    get:
      tags: [Gateway]
      summary: 系统全局健康检查
      operationId: globalHealthCheck
      responses:
        "200":
          description: 各模块健康状态汇总

  /ops/tokens/report:
    get:
      tags: [Gateway]
      summary: Token 消耗报告
      operationId: getTokenReport
      parameters:
        - name: hours
          in: query
          schema:
            type: integer
            default: 24
      responses:
        "200":
          description: Token 消耗汇总

components:
  schemas:
    ChatResponse:
      type: object
      properties:
        session_id:
          type: string
        reply:
          type: string
          description: AI 书友的回复
        intent:
          type: string
          enum: [search, sentiment, trend, mixed]
        sources:
          type: array
          items:
            $ref: "#/components/schemas/NovelCard"
        latency_ms:
          type: integer

    FallbackResponse:
      type: object
      properties:
        session_id:
          type: string
        reply:
          type: string
        fallback:
          type: boolean
          enum: [true]
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/NovelCard"

    NovelCard:
      type: object
      properties:
        uid:
          type: string
        title:
          type: string
        author:
          type: string
        platform:
          type: string
        heat_score:
          type: number
        overall_rating:
          type: number

    # 复用 Data Contract 中的 Schema
    TrendData:
      $ref: "../data-contract-spec.md#TrendData"

    TagEvolution:
      type: object
      properties:
        tag:
          type: string
        data_points:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              frequency:
                type: integer
              growth_rate:
                type: number

    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: 自然语言搜索语句
        filters:
          type: object
          properties:
            tags_include:
              type: array
              items:
                type: string
            tags_exclude:
              type: array
              items:
                type: string
            min_heat:
              type: number
            platforms:
              type: array
              items:
                type: string
        safe_tags:
          type: array
          items:
            type: string
          description: 避雷标签列表
        top_k:
          type: integer
          default: 10

    SearchResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              uid:
                type: string
              metadata:
                $ref: "#/components/schemas/Metadata"
              relevance_score:
                type: number
              match_reason:
                type: string
              safe_check:
                type: object
                properties:
                  passed:
                    type: boolean
                  warnings:
                    type: array
                    items:
                      type: string
        query_rewrite:
          type: string
        total_hits:
          type: integer

    SentimentData:
      type: object
      properties:
        uid:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
        sentiment_scores:
          $ref: "#/components/schemas/SentimentScores"
        critic_summary:
          $ref: "#/components/schemas/CriticSummary"
        review_stats:
          $ref: "#/components/schemas/ReviewStats"

    Metadata:
      type: object
      properties:
        title:
          type: string
        platform:
          type: string
        last_update:
          type: string
          format: date-time

    SentimentScores:
      type: object
      properties:
        overall:
          type: number
          minimum: 0
          maximum: 10
        style:
          type: number
        logic:
          type: number
        character:
          type: number
        update_stability:
          type: number
        toxicity_index:
          type: number
          minimum: 0
          maximum: 1

    CriticSummary:
      type: object
      properties:
        one_liner:
          type: string
        pros:
          type: array
          items:
            type: string
        cons:
          type: array
          items:
            type: string

    ReviewStats:
      type: object
      properties:
        total_count:
          type: integer
        positive_ratio:
          type: number
        negative_ratio:
          type: number
        source_breakdown:
          type: object
