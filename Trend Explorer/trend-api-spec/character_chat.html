<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色扮演 — 网络小说智能推荐与舆情分析系统</title>
<style>
:root {
  --bg: #f5f6fa; --card-bg: #fff; --text: #1a1a2e; --text2: #6b7280;
  --accent: #6366f1; --accent2: #818cf8; --border: #e5e7eb;
  --msg-user: #6366f1; --msg-char: #f3f4f6; --danger: #ef4444;
}
[data-theme="dark"] {
  --bg: #0f172a; --card-bg: #1e293b; --text: #e2e8f0; --text2: #94a3b8;
  --border: #334155; --msg-char: #1e293b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
  display: flex; flex-direction: column; transition: background 0.3s, color 0.3s;
}
/* ---- header ---- */
.header {
  background: var(--card-bg); border-bottom: 1px solid var(--border);
  padding: 10px 20px; display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.header h1 { font-size: 1.2rem; font-weight: 700; }
.header .sub { font-size: 0.78rem; color: var(--text2); margin-left: 8px; }
.header-actions { display: flex; gap: 6px; align-items: center; }
.btn {
  padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card-bg); color: var(--text); cursor: pointer; font-size: 0.83rem;
  transition: all 0.2s; white-space: nowrap; text-decoration: none; display: inline-block;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-accent:hover { background: var(--accent2); }
.btn-sm { padding: 5px 10px; font-size: 0.78rem; }
/* ---- layout ---- */
.main-layout { display: flex; flex: 1; overflow: hidden; }
/* ---- sidebar ---- */
.sidebar {
  width: 300px; min-width: 300px; border-right: 1px solid var(--border);
  background: var(--card-bg); overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 14px;
}
.sidebar h3 { font-size: 0.9rem; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.sidebar .divider { border-top: 1px solid var(--border); margin: 4px 0; }
.char-list { display: flex; flex-direction: column; gap: 6px; }
.char-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: 10px; border: 2px solid transparent; cursor: pointer;
  transition: all 0.15s; background: var(--bg);
}
.char-item:hover { border-color: var(--accent2); }
.char-item.active { border-color: var(--accent); background: rgba(99,102,241,0.08); }
.char-item .c-emoji { font-size: 1.5rem; width: 36px; text-align: center; flex-shrink: 0; }
.char-item .c-info { overflow: hidden; }
.char-item .c-name { font-weight: 700; font-size: 0.9rem; }
.char-item .c-book { font-size: 0.73rem; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.char-item .c-del {
  margin-left: auto; color: var(--text2); cursor: pointer; padding: 4px; border-radius: 4px;
  font-size: 0.75rem; opacity: 0; transition: opacity 0.15s;
}
.char-item:hover .c-del { opacity: 1; }
.char-item .c-del:hover { color: var(--danger); background: rgba(239,68,68,0.1); }
/* custom form */
.create-form { display: flex; flex-direction: column; gap: 8px; }
.create-form input {
  width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 0.85rem; outline: none;
}
.create-form input:focus { border-color: var(--accent); }
.create-form .hint { font-size: 0.73rem; color: var(--text2); }
/* ---- chat area ---- */
.chat-area {
  flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 16px 20px;
}
.chat-box {
  flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
  overflow-y: auto; padding: 20px; margin-bottom: 12px;
  display: flex; flex-direction: column; gap: 12px;
}
.welcome-banner { text-align: center; padding: 60px 20px; color: var(--text2); }
.welcome-banner .icon { font-size: 3rem; margin-bottom: 12px; }
.welcome-banner h2 { font-size: 1.1rem; color: var(--text); margin-bottom: 8px; }
.welcome-banner p { margin-bottom: 4px; }
.msg {
  max-width: 75%; padding: 12px 16px; border-radius: 14px; line-height: 1.6;
  font-size: 0.92rem; word-break: break-word; animation: fadeIn 0.3s;
}
.msg-char { align-self: flex-start; background: var(--msg-char); border-bottom-left-radius: 4px; }
.msg-user { align-self: flex-end; background: var(--msg-user); color: #fff; border-bottom-right-radius: 4px; }
.msg .sender { font-size: 0.75rem; opacity: 0.7; margin-bottom: 3px; }
.msg .time { font-size: 0.68rem; opacity: 0.45; margin-top: 3px; text-align: right; }
.typing { align-self: flex-start; padding: 12px 16px; color: var(--text2); font-style: italic; font-size: 0.85rem; }
.typing::after { content: ''; animation: dots 1.2s steps(4,end) infinite; }
@keyframes dots { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} 100%{content:''} }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
/* ---- input ---- */
.input-row { display: flex; gap: 10px; }
.input-row input {
  flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--card-bg); color: var(--text); font-size: 0.92rem; outline: none;
}
.input-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
.input-row button { padding: 12px 28px; }
/* ---- modal ---- */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card-bg); border-radius: 16px; padding: 24px; max-width: 420px; width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal h3 { margin-bottom: 12px; }
.modal input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 12px; }
.modal .note { font-size: 0.78rem; color: var(--text2); margin-bottom: 12px; }
</style>
</head>

<!-- ========== header ========== -->
<div class="header">
  <div style="display:flex;align-items:center;gap:10px">

    <div id="createStatus" style="margin-top:6px;font-size:0.78rem;color:var(--text2)"></div>

</div>

<!-- CHAT AREA -->
<div class="chat-area">
  <div class="chat-box" id="chatBox">
    <div class="welcome-banner">

      <p style="margin-top:8px;font-size:0.85rem;color:var(--text2)">
        也可以输入任意书名和主角名，AI将自动创建角色。
      </p>
    </div>
  </div>

  <div class="input-row">
    <input id="msgInput" type="text" placeholder="输入消息，按 Enter 发送…" onkeydown="if(event.key==='Enter')sendMsg()" />
    <button class="btn btn-accent" onclick="sendMsg()">发送</button>
  </div>
</div>

</div>

// Custom characters (stored in memory + localStorage)
let customChars = [];
const CUSTOM_CHARS_KEY = "rp_custom_chars";

function loadCustomChars() {
  try {
    const raw = localStorage.getItem(CUSTOM_CHARS_KEY);
    if (raw) customChars = JSON.parse(raw);
  } catch(e) { customChars = []; }
}
function saveCustomChars() {
  localStorage.setItem(CUSTOM_CHARS_KEY, JSON.stringify(customChars));
}

function allChars() { return [...PRESET_CHARS, ...customChars]; }

// ============================================================
// Init
// ============================================================
function init() {
  const saved = localStorage.getItem("unified-theme");
  if (saved) document.documentElement.dataset.theme = saved;
  loadCustomChars();
  renderSidebar();
}
function toggleTheme() {
  const el = document.documentElement;
  const next = el.dataset.theme === "dark" ? "light" : "dark";
  el.dataset.theme = next;
  localStorage.setItem("unified-theme", next);
}

// ============================================================
// Sidebar rendering
// ============================================================
function renderSidebar() {
  const all = allChars();
  // Preset
  document.getElementById("presetList").innerHTML = PRESET_CHARS.map(c =>
    charItemHTML(c)
  ).join("");
  // Custom
  document.getElementById("customList").innerHTML = customChars.map(c =>
    charItemHTML(c, true)
  ).join("");
}

function charItemHTML(c, isCustom) {
  const active = currentChar && currentChar.id === c.id ? ' active' : '';
  const delBtn = isCustom
    ? `<span class="c-del" onclick="event.stopPropagation();deleteCustom('${c.id}')" title="删除">✕</span>`
    : '';
  return `<div class="char-item${active}" onclick="selectChar('${c.id}')">
    <span class="c-emoji">${c.emoji}</span>
    <span class="c-info"><span class="c-name">${c.name}</span><br><span class="c-book">《${c.book}》</span></span>
    ${delBtn}
  </div>`;
}

function selectChar(id) {
  currentChar = allChars().find(c => c.id === id);
  if (!currentChar) return;
  messages = [];
  renderSidebar();
  const box = document.getElementById("chatBox");
  const greeting = currentChar.quote
    ? `「${currentChar.quote}」\n\n你好，我是${currentChar.name}，来自《${currentChar.book}》。有什么想问的、想聊的，尽管说吧。`
    : `你好，我是${currentChar.name}，来自《${currentChar.book}》。有什么想问的、想聊的，尽管说吧。`;
  box.innerHTML = "";
  addBubble("char", greeting);
  document.getElementById("msgInput").focus();
}

function deleteCustom(id) {
  customChars = customChars.filter(c => c.id !== id);
  if (currentChar && currentChar.id === id) {
    currentChar = null;
    messages = [];
    document.getElementById("chatBox").innerHTML = `<div class="welcome-banner"><div class="icon">🎭</div><h2>角色已删除</h2><p>请选择其他角色继续对话。</p></div>`;
  }
  saveCustomChars();
  renderSidebar();
}

// ============================================================
// Custom character creation
// ============================================================
async function createCustomChar() {
  if (isCreating) return;
  const book = document.getElementById("customBook").value.trim();
  const name = document.getElementById("customName").value.trim();
  if (!book || !name) { alert("请填入书名和主角名"); return; }

  isCreating = true;
  const btn = document.getElementById("createBtn");
  const status = document.getElementById("createStatus");
  btn.disabled = true;
  btn.textContent = "⏳ 正在生成人设...";
  status.textContent = "AI 正在搜索《" + book + "》中" + name + "的资料...";

  try {
    const prompt = `请为网络小说《${book}》中的主角「${name}」设计一份角色扮演系统提示词。你需要根据你对这部小说和这个角色的了解，生成一段详细的人设描述，包括：

1. 角色身份和背景（在书中的定位、经历概要）
2. 性格特点（具体、生动）
3. 所在世界的世界观（修炼体系、重要设定等）
4. 说话风格和口吻
5. 重要的关系人物和剧情节点

请用第二人称"你"来描述，格式为一段连续的文字（不要用json，不要用markdown标题），作为角色扮演的系统prompt使用。如果角色知名度较低或你不确定，请根据书名和名字进行合理推断，并注明"以下为基于书名的推演设定"。`;

    const resp = await fetch(DEEPSEEK_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${API_KEY}`,
      },
      body: JSON.stringify({
        model: DEEPSEEK_MODEL,
        messages: [{ role: "user", content: prompt }],
        temperature: 0.8,
        max_tokens: 1500,
      }),
    });
    if (!resp.ok) { const err = await resp.text(); throw new Error(`API ${resp.status}: ${err}`); }
    const data = await resp.json();
    const systemPrompt = data.choices[0].message.content;

    // Create custom character
    const id = "custom_" + Date.now();
    const emojis = ["🧙","⚔","🌟","💫","🛡","🎯","🔮","📖","🏰","🗡","🔥","👑","🌸","🐉","💀","🌙","⭐","💎","🎪","🌊"];
    const emoji = emojis[Math.floor(Math.random() * emojis.length)];

    customChars.push({
      id, name, emoji, book, author: "自定义",
      quote: "",
      system: systemPrompt,
    });
    saveCustomChars();
    renderSidebar();

    // Auto-select
    currentChar = customChars.find(c => c.id === id);
    messages = [];
    renderSidebar();
    const box = document.getElementById("chatBox");
    box.innerHTML = "";
    addBubble("char", `你好，我是${name}，来自《${book}》。有什么想问的、想聊的，尽管说吧。`);

    document.getElementById("customBook").value = "";
    document.getElementById("customName").value = "";
    status.textContent = "✅ 角色「" + name + "」创建成功！";

  } catch(e) {
    console.error(e);
    status.textContent = "❌ 创建失败：" + e.message;
  } finally {
    isCreating = false;
    btn.disabled = false;
    btn.textContent = "✨ 创建角色";
  }
}

// ============================================================
// Chat UI
// ============================================================
function addBubble(role, text) {
  const box = document.getElementById("chatBox");
  const banner = box.querySelector(".welcome-banner");
  if (banner) banner.remove();
  const div = document.createElement("div");
  div.className = role === "user" ? "msg msg-user" : "msg msg-char";
  const sender = role === "user" ? "你" : (currentChar ? currentChar.name : "角色");
  const now = new Date().toLocaleTimeString("zh-CN", { hour:"2-digit", minute:"2-digit" });
  div.innerHTML = `<div class="sender">${sender}</div>${esc(text).replace(/\n/g,"<br>")}<div class="time">${now}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function addTyping() {
  const box = document.getElementById("chatBox");
  const banner = box.querySelector(".welcome-banner");
  if (banner) banner.remove();
  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typingInd";
  div.textContent = (currentChar ? currentChar.name : "角色") + "正在思考";
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function removeTyping() { const el = document.getElementById("typingInd"); if(el) el.remove(); }
function esc(s) { const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function clearChat() {
  if (!currentChar) return;
  messages = [];
  document.getElementById("chatBox").innerHTML = "";
  const greeting = currentChar.quote
    ? `「${currentChar.quote}」\n\n你好，我是${currentChar.name}，来自《${currentChar.book}》。有什么想问的、想聊的，尽管说吧。`
    : `你好，我是${currentChar.name}，来自《${currentChar.book}》。有什么想问的、想聊的，尽管说吧。`;
  addBubble("char", greeting);
}

// ============================================================
// DeepSeek Chat API
// ============================================================
async function callDeepSeek(userMsg) {
  const history = [{ role:"system", content: currentChar.system }];
  for (const m of messages) history.push(m);
  history.push({ role:"user", content: userMsg });
  try {
    const resp = await fetch(DEEPSEEK_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${API_KEY}`},
      body: JSON.stringify({ model:DEEPSEEK_MODEL, messages:history, temperature:0.85, max_tokens:1000 }),
    });
    if (!resp.ok) { const e = await resp.text(); throw new Error(`API ${resp.status}: ${e}`); }
    const data = await resp.json();
    return data.choices[0].message.content;
  } catch(e) {
    console.error(e);
    return `（对话出错了：${e.message}。请检查 API Key 是否正确，或稍后重试。）`;
  }
}

async function sendMsg() {
  if (isTyping) return;
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;
  if (!currentChar) { alert("请先在左侧选择一个角色！"); return; }
  input.value = "";
  addBubble("user", text);
  messages.push({ role:"user", content:text });
  isTyping = true;
  addTyping();
  const reply = await callDeepSeek(text);
  removeTyping();
  isTyping = false;
  if (reply) { addBubble("char", reply); messages.push({ role:"assistant", content:reply }); }
}

// ============================================================
// Startup
// ============================================================
init();
</script>
