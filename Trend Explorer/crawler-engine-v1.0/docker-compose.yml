services:
  redis:
    image: redis:7-alpine
    container_name: novel-trend-redis
    profiles: ["queue"]
    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
        "--requirepass",
        "${REDIS_PASSWORD:-novel-trend-local-only}"
      ]
    expose:
      - "6379"
    user: "redis"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data

  crawler:
    build:
      context: .
    container_name: novel-trend-crawler
    env_file:
      - .env.example
    environment:
      PLAYWRIGHT_ENABLED: "true"
      OUTPUT_DIR: /app/data
    volumes:
      - ./data:/app/data
    command: ["scrapy", "crawl", "qidian_trends"]

  crawler-all-once:
    build:
      context: .
    profiles: ["manual"]
    env_file:
      - .env.example
    environment:
      PLAYWRIGHT_ENABLED: "true"
      OUTPUT_DIR: /app/data
    volumes:
      - ./data:/app/data
    command: ["sh", "scripts/run_all_once.sh"]

  crawler-scheduled:
    build:
      context: .
    profiles: ["schedule"]
    env_file:
      - .env.example
    environment:
      PLAYWRIGHT_ENABLED: "true"
      OUTPUT_DIR: /app/data
      CRAWL_INTERVAL_HOURS: 72
    volumes:
      - ./data:/app/data
    command: ["sh", "scripts/run_scheduled.sh"]

  crawler-zongheng:
    build:
      context: .
    profiles: ["manual"]
    env_file:
      - .env.example
    environment:
      PLAYWRIGHT_ENABLED: "true"
      OUTPUT_DIR: /app/data
    volumes:
      - ./data:/app/data
    command: ["scrapy", "crawl", "zongheng_trends"]

volumes:
  redis-data:
